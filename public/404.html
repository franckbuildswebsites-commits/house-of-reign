<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Reign Studios</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <style>
      /* Standalone 404 in the site's style (served by Cloudflare for unknown paths, see wrangler.jsonc). */
      @font-face { font-family: "Inter Tight"; src: url("/fonts/inter-tight-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
      :root { --page: #ffffff; --ink: #1d1d1f; --dim: #424245; --accent: #4338ca; --accent-hover: #3730a3; --on-accent: #ffffff; --gutter: clamp(1.5rem, calc(9.14vw - 0.73rem), 7.5rem); --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter Tight", system-ui, sans-serif; }
      :root.dark { --page: #000000; --ink: #ffffff; --dim: #a1a1a6; --accent: #818cf8; --accent-hover: #a5b4fc; --on-accent: #000000; color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100svh; display: flex; flex-direction: column; background: var(--page); color: var(--ink); font: 400 1.0625rem/1.47 var(--font); letter-spacing: -0.012em; -webkit-font-smoothing: antialiased; overflow-x: clip; }
      a { color: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      header, main { width: 100%; max-width: calc(75rem + 2 * var(--gutter)); margin-inline: auto; padding-inline: var(--gutter); }
      header { height: 3rem; display: flex; align-items: center; }
      .mark { display: inline-flex; align-items: center; gap: 0.3em; font-weight: 600; font-size: 1.3125rem; line-height: 1; letter-spacing: -0.03em; text-decoration: none; }
      .mark img { height: 2rem; width: auto; display: block; }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 4rem; }
      .big { font-weight: 600; font-size: clamp(1.1875rem, 1.5vw, 1.3125rem); color: var(--dim); }
      h1 { margin-top: 0.5rem; font-weight: 600; font-size: clamp(2.75rem, 5.6vw, 5rem); line-height: 1.05; letter-spacing: -0.03em; }
      h1 span { display: block; color: var(--dim); }
      .row { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; align-items: center; }
      .btn { display: inline-flex; align-items: center; min-height: 2.5rem; padding: 0.375rem 1.125rem; border-radius: 999px; font-size: 0.9375rem; text-decoration: none; background: var(--accent); color: var(--on-accent); transition: background-color 0.24s var(--ease); }
      .btn:hover { background: var(--accent-hover); }
      .more { display: inline-flex; align-items: center; gap: 0.3em; min-height: 2.75rem; font-size: 0.9375rem; color: var(--accent); text-decoration: none; }
      .more:hover { text-decoration: underline; text-underline-offset: 3px; }
      .more::after { content: ""; width: 0.42em; height: 0.42em; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: rotate(45deg); }
      @media (pointer: coarse) { .btn { min-height: 2.75rem; } }
      .rise { animation: rise 0.7s var(--ease) both; }
      @keyframes rise { from { transform: translateY(16px); } to { transform: none; } }
      @media (prefers-reduced-motion: reduce) { .rise { animation: none; } .btn { transition: none; } }
    </style>
    <script>
      // Same theme as the main site: light, unless the visitor chose dark with the switch.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').content = "#000000";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <header>
      <a class="mark" href="/" aria-label="Reign Studios, home">
        <img src="/brand/reign-mark-header.png" alt="" height="32" />
      </a>
    </header>
    <main class="rise">
      <p class="big" aria-hidden="true">404</p>
      <h1>This page doesn't exist.<span>The rest of the site does.</span></h1>
      <div class="row">
        <a class="btn" href="/">Back to the home page</a>
        <a class="more" href="sms:+17542776110">Message us</a>
      </div>
    </main>
  </body>
</html>
