<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--site-meta-->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Before the first paint: the theme (a saved choice, otherwise the device setting; ThemeToggle.jsx),
      // and "lite" mode for touch devices, low-core CPUs or Save-Data, which drops the heaviest
      // continuous effects (index.css).
      try {
        var n = navigator, c = n.connection;
        if (matchMedia("(hover: none)").matches || (n.hardwareConcurrency || 8) <= 4 || (n.deviceMemory || 8) <= 4 || (c && c.saveData))
          document.documentElement.classList.add("lite");
      } catch (e) {}
      try {
        var saved = localStorage.getItem("theme");
      } catch (e) {}
      try {
        if (saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#000000";
        }
      } catch (e) {}
      // Apple devices use the system font; everyone else needs Inter right away (no layout shift).
      try {
        if (!/Mac|iPhone|iPad|iPod/.test(navigator.platform)) {
          var f = document.createElement("link");
          f.rel = "preload"; f.as = "font"; f.type = "font/woff2"; f.href = "/fonts/inter-latin.woff2"; f.crossOrigin = "";
          document.head.appendChild(f);
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload only what the hero needs: the wall images (phone or desktop set, AVIF).
         Everything below the fold loads lazily. -->
    <link rel="preload" href="/portfolio/wall/col-1-sm.avif" as="image" type="image/avif" media="(max-width: 639px)" />
    <link rel="preload" href="/portfolio/wall/col-2-sm.avif" as="image" type="image/avif" media="(max-width: 639px)" />
    <link rel="preload" href="/portfolio/wall/col-3-sm.avif" as="image" type="image/avif" media="(max-width: 639px)" />
    <link rel="preload" href="/portfolio/wall/col-4-sm.avif" as="image" type="image/avif" media="(max-width: 639px)" />
    <link rel="preload" href="/portfolio/wall/col-1.avif" as="image" type="image/avif" media="(min-width: 640px)" />
    <link rel="preload" href="/portfolio/wall/col-2.avif" as="image" type="image/avif" media="(min-width: 640px)" />
    <link rel="preload" href="/portfolio/wall/col-3.avif" as="image" type="image/avif" media="(min-width: 640px)" />
    <link rel="preload" href="/portfolio/wall/col-4.avif" as="image" type="image/avif" media="(min-width: 640px)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
