<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--site-meta-->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <script>
      // Before the first paint: dark mode, only if the visitor chose it with the switch (ThemeToggle.jsx;
      // the device setting is ignored on purpose, everyone opens in light); "lite" mode for touch
      // devices, low-core CPUs or Save-Data, which skips scroll parallax (Parallax.jsx) and draws the hero
      // drop at lower resolution; and "saver" for Save-Data.
      try {
        var n = navigator, c = n.connection;
        if (matchMedia("(hover: none)").matches || (n.hardwareConcurrency || 8) <= 4 || (n.deviceMemory || 8) <= 4 || (c && c.saveData))
          document.documentElement.classList.add("lite");
        if (c && c.saveData) document.documentElement.classList.add("saver");
      } catch (e) {}
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#000000";
        }
      } catch (e) {}
      // The hero drop's first frame, for this theme and screen size (index.css, Blob.jsx).
      try {
        var img = document.createElement("link");
        img.rel = "preload"; img.as = "image"; img.type = "image/avif"; img.fetchPriority = "high";
        img.href = "/blob/drop-" + (document.documentElement.dataset.theme === "dark" ? "dark" : "light") + (matchMedia("(max-width: 639px)").matches ? "-640" : "-1100") + ".avif";
        document.head.appendChild(img);
      } catch (e) {}
      // Apple devices use the system font; everyone else needs Inter right away (no layout shift).
      try {
        if (!/Mac|iPhone|iPad|iPod/.test(navigator.platform)) {
          var f = document.createElement("link");
          f.rel = "preload"; f.as = "font"; f.type = "font/woff2"; f.href = "/fonts/inter-latin.woff2"; f.crossOrigin = "";
          document.head.appendChild(f);
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
